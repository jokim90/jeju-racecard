name: 데이터 갱신 및 배포

on:
  schedule:
    - cron: "50 20 * * *"   # 매일 05:50 (한국시간)
    - cron: "50 11 * * 5,6,0" # 금·토·일 20:50 (한국시간), 경주 결과 반영
  workflow_dispatch:
    inputs:
      race_dt:
        description: "경주일자 YYYYMMDD (비우면 오늘)"
        required: false
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 공공데이터포털에서 수집
        if: github.event_name != 'push'
        env:
          JEJU_API_KEY: ${{ secrets.JEJU_API_KEY }}
        run: |
          DT="${{ github.event.inputs.race_dt }}"
          [ -z "$DT" ] && DT=$(date +%Y%m%d)
          python collector/jeju_collect.py "$DT" --cache-from site/latest.json --out /tmp/new.json

      - name: 받은 데이터가 비어 있지 않을 때만 교체
        if: github.event_name != 'push'
        run: |
          python - <<'EOF'
          import json, shutil, sys
          j = json.load(open("/tmp/new.json", encoding="utf-8"))
          old = json.load(open("site/latest.json", encoding="utf-8"))
          if not j.get("sheet") and old.get("sheet"):
              # 출전표를 못 받았으면(키 오류·API 장애) 아무것도 덮어쓰지 않는다
              print("::error::출전표를 받지 못했습니다(API 키 또는 공공데이터포털 오류). 기존 latest.json을 유지합니다.")
              sys.exit(0)
          # 이번에 비어 온 항목은 이전 값을 그대로 둔다 (일부 API만 실패한 경우)
          for k, v in old.items():
              if isinstance(v, list) and v and not j.get(k):
                  print(f"::warning::{k} 수집 실패, 이전 값 {len(v)}건 유지"); j[k] = v
          key = lambda p: (str(p.get("rcDate")), str(p.get("rcNo")), str(p.get("hrNo") or p.get("hrName")))
          m = {key(p): p for p in old.get("pace") or []}; m.update({key(p): p for p in j.get("pace") or []}); j["pace"] = list(m.values())
          json.dump(j, open("site/latest.json", "w", encoding="utf-8"), ensure_ascii=False)
          print("latest.json 교체:", {k: len(v) for k, v in j.items() if isinstance(v, list)})
          EOF

      - name: 모형 이력 갱신과 출마표 분석 (배당 미사용)
        if: github.event_name != 'push'
        env:
          JEJU_API_KEY: ${{ secrets.JEJU_API_KEY }}
        run: |
          pip install --quiet pandas numpy
          DT="${{ github.event.inputs.race_dt }}"
          [ -z "$DT" ] && DT=$(date +%Y%m%d)
          python model/update_history.py "$DT" || echo "::warning::이력 갱신 실패, 기존 이력으로 예측합니다."
          python model/predict.py site/latest.json || echo "::warning::모형 예측 실패, 레이스카드는 기본 모형을 씁니다."

      - name: latest.json 저장소에 기록
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/latest.json model/history/
          git diff --cached --quiet || git commit -m "데이터 갱신 $(date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 경주일이면 실시간 결과 루프 시작 (예약 실행이 빠져도 아침 갱신 뒤 바로 이어지도록)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$(date +%H%M)
          if [ "$H" -lt 1900 ]; then gh workflow run live.yml --ref main && echo "live.yml 실행 요청"; fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
