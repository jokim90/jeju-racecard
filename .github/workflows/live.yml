name: 경주일 실시간 결과 갱신

# 경주일(출전표에 오늘 경주가 있는 날)에만 10분 간격으로 결과·구간 기록을 받아 latest.json에 합치고 사이트를 다시 배포합니다.
# 경주가 없는 날은 수집기가 종료 코드 3으로 바로 끝나고 배포하지 않습니다. GitHub 예약 실행은 몇 분 늦어질 수 있습니다.
on:
  schedule:
    - cron: "*/10 1-10 * * 1,5,6,0"   # UTC 01:00~10:59 = 한국시간 10:00~19:59, 월·금·토·일
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".live-ping"]        # 이 파일을 갱신해 푸시하면 즉시 한 번 수집 (예약 실행이 밀릴 때 수동/외부 트리거용)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  live:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 결과·구간 기록만 빠르게 수집
        id: collect
        env:
          JEJU_API_KEY: ${{ secrets.JEJU_API_KEY }}
        run: |
          set +e
          python collector/jeju_collect.py "$(date +%Y%m%d)" --results-only --merge-into site/latest.json --out site/latest.json --only-race-days
          code=$?
          set -e
          if [ "$code" = "3" ]; then echo "오늘은 경주가 없습니다."; echo "changed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then exit $code; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/latest.json
          if git diff --cached --quiet; then
            echo "변경 없음"; echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            git commit -m "실시간 결과 갱신 $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v5
        if: steps.collect.outputs.changed == 'yes'
      - uses: actions/upload-pages-artifact@v3
        if: steps.collect.outputs.changed == 'yes'
        with:
          path: site

  deploy:
    needs: live
    if: needs.live.outputs.changed == 'yes'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
