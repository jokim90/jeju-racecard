<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeju Racing · Race Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Barlow+Condensed:ital,wght@0,600;0,800;1,600;1,800&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: race-day header → numbered race strip (real race order) → one race explained in plain language → glossary → data loader */
:root{
  --bg:#eef0ec; --surface:#ffffff; --ink:#1d2321; --muted:#5f6a66; --line:#d5dad5;
  --basalt:#2d3532; --tangerine:#c9661a; --sea:#1f6f73; --chip:#e3e8e3;
  --display:"Black Han Sans","Apple SD Gothic Neo",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161a19; --surface:#1f2523; --ink:#e7ebe8; --muted:#9aa5a0; --line:#323a37;
  --basalt:#0e1110; --tangerine:#f08a3a; --sea:#5bb3b6; --chip:#2a312e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161a19; --surface:#1f2523; --ink:#e7ebe8; --muted:#9aa5a0; --line:#323a37;
  --basalt:#0e1110; --tangerine:#f08a3a; --sea:#5bb3b6; --chip:#2a312e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
header.day{background:var(--basalt);color:#f1f3f1;border-radius:14px;padding:20px 22px;display:grid;gap:14px}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#b8c2bd}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,40px);line-height:1.1;margin:4px 0 0;text-wrap:balance}
.lang{display:flex;background:#3d4743;border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:#cfd6d2;font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--tangerine);color:#fff}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:#d7ddda}
.facts b{color:#fff;font-weight:700}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days button{border:1px solid #4a5551;background:transparent;color:#d7ddda;font:inherit;font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:999px;cursor:pointer}
.days button[aria-pressed="true"]{background:#f1f3f1;color:#1d2321;border-color:#f1f3f1}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.rbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;font:inherit;display:grid;gap:2px}
.rbtn:hover{border-color:var(--sea)}
.rbtn:focus-visible,.lang button:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--tangerine);outline-offset:2px}
.rbtn[aria-pressed="true"]{border-color:var(--tangerine);box-shadow:inset 0 0 0 1px var(--tangerine)}
.rno{font-family:var(--display);font-size:22px;line-height:1}
.rmeta{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rclass{font-size:12px;color:var(--sea);font-weight:500}
main.race{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:22px}
.rhead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.rhead h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,5vw,32px);margin:0;line-height:1.15;text-wrap:balance}
.rhead .sub{color:var(--muted);font-size:14px}
.post{font-family:var(--mono);font-size:28px;font-variant-numeric:tabular-nums;color:var(--tangerine);text-align:right;line-height:1.1}
.post small{display:block;font-family:var(--body);font-size:12px;color:var(--muted)}
.lede{font-size:16px;max-width:65ch;margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.grid2>*{min-width:0}
h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:500}
dl.cond{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;margin:0}
dl.cond dt{color:var(--muted);font-size:14px;white-space:nowrap}
dl.cond dd{margin:0}
dl.cond dd .why{display:block;font-size:13px;color:var(--muted);line-height:1.5}
.chip{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 8px;font-size:14px;font-weight:500}
.track{position:relative;height:34px;background:var(--chip);border-radius:6px;overflow:hidden}
.track .run{position:absolute;inset:0 auto 0 0;background:var(--sea);opacity:.85}
.track span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:12px;color:var(--muted)}
.track .run span{color:#fff;left:8px;right:auto}
.scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px}
.prizes{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.prow .pl{font-size:13px;color:var(--muted)}
.bar{height:12px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tangerine)}
.prow:not(:first-child) .bar i{opacity:.55}
.amt{font-family:var(--mono);font-size:13px}
.total{margin-top:6px;font-size:13px;color:var(--muted)}
.going{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:8px}
.going div{font-size:11px;text-align:center;padding:4px 0;border-radius:4px;background:var(--chip);color:var(--muted)}
.going div.on{background:var(--sea);color:#fff;font-weight:700}
.note{border-left:3px solid var(--tangerine);padding:4px 0 4px 12px;font-size:14px;max-width:65ch;margin:0}
section.gloss{display:grid;gap:10px}
section.gloss h2,section.load h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.term{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.term b{display:block}
.term p{margin:2px 0 0;font-size:14px;color:var(--muted)}
section.load{display:grid;gap:8px}
section.load p{margin:0;color:var(--muted);font-size:14px;max-width:65ch}
textarea{width:100%;min-height:110px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;background:var(--sea);color:#fff;font:inherit;font-size:14px;padding:8px 16px;border-radius:8px;cursor:pointer}
label.btn{display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.msg{font-size:13px}
.msg.err{color:var(--tangerine)}
.sample{font-size:12px;color:var(--muted)}
.entries{display:grid;gap:10px}
.entries .ehead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.entries .ehead p{margin:0;font-size:13px;color:var(--muted);max-width:65ch}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--chip)}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:2px solid var(--tangerine)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--chip)}
tbody tr[aria-selected="true"]{background:var(--chip);box-shadow:inset 3px 0 0 var(--tangerine)}
tbody tr:last-child td{border-bottom:0}
.hn{font-weight:700}
.sx{display:inline-block;min-width:22px;text-align:center;border-radius:4px;font-size:12px;padding:0 4px;background:var(--chip)}
.rt{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.rt i{display:block;height:6px;border-radius:3px;background:var(--sea)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:15px;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--tangerine);font-weight:700}
.tabs button:disabled{opacity:.4;cursor:default}
.tabs span{font-family:var(--mono);font-size:12px}
.saddle{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:5px;background:var(--basalt);color:#fff;font-family:var(--mono);font-size:13px;vertical-align:middle}
.flag{font-size:11px;padding:1px 6px;border-radius:4px;background:color-mix(in srgb,var(--tangerine) 18%,transparent);color:var(--tangerine);white-space:nowrap}
.flag.in{background:color-mix(in srgb,var(--sea) 18%,transparent);color:var(--sea)}
tr.out td{color:var(--muted)}
ul.vet{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
ul.vet .d{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:6px}
ul.vet .gl{color:var(--muted)}
#tabbody{display:grid;gap:10px}
section.results{display:grid;gap:12px}
section.results>h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.rlede{margin:0;color:var(--muted);font-size:14px;max-width:65ch}
.rdays{display:grid;gap:10px}
.rgl{font-size:12px;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
#resDate{font:inherit;font-family:var(--mono);font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin-bottom:8px;max-width:100%}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;padding:5px 10px;border-radius:8px;cursor:pointer;font-family:var(--display)}
.rchip small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.rchip[aria-pressed="true"]{border-color:var(--tangerine);box-shadow:inset 0 0 0 1px var(--tangerine)}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:16px}
.place{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;background:var(--chip)}
.place.p1{background:var(--win);color:#fff;box-shadow:0 0 0 2px var(--winring)}.place.p2,.place.p3{background:var(--chip);color:var(--ink)}
.bwd{font-size:11px;margin-left:4px;color:var(--muted)}.bwd.up{color:var(--tangerine)}.bwd.dn{color:var(--sea)}
ul.recent{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px}
ul.recent .d{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:6px}
tr.has{cursor:pointer}tr.has:hover{background:var(--chip)}tr.has[aria-selected="true"]{background:var(--chip);box-shadow:inset 3px 0 0 var(--tangerine)}
.flag.info{background:var(--chip);color:var(--ink)}
.eng{font-family:var(--mono);font-size:14px;color:var(--muted);letter-spacing:.04em;margin-left:6px}
.ped{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.ped .pk{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;align-self:center}
#rinfo{display:grid}
.jw{font-family:var(--mono);font-size:11px;padding:0 5px;border-radius:4px;background:var(--chip);color:var(--muted);margin-left:4px}
.jw.hot{background:color-mix(in srgb,var(--tangerine) 20%,transparent);color:var(--tangerine)}
.jw.cold{opacity:.7}
.sub2{font-size:12px;color:var(--muted)}
td.form{white-space:nowrap}
.fp{display:inline-flex;width:18px;height:18px;border-radius:4px;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;background:var(--chip);color:var(--muted);margin-right:2px}
.fp.top{width:auto;padding:0 5px;font-size:10px;letter-spacing:.02em}
.fp1{background:var(--win);color:#fff;box-shadow:0 0 0 2px var(--winring)}.fp2,.fp3{background:var(--chip);color:var(--ink)}
.noform{color:var(--muted)}
/* drawer */
[hidden]{display:none!important}
.dback{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
body.drawer-open .dback{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);color:var(--ink);z-index:41;box-shadow:-8px 0 30px rgba(0,0,0,.2);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.dclose{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;line-height:1;cursor:pointer;z-index:1}
.dbody{overflow-y:auto;padding:20px 20px calc(32px + env(safe-area-inset-bottom,0px));display:grid;gap:22px;align-content:start}
.dh h2{font-family:var(--display);font-weight:400;font-size:28px;margin:4px 40px 4px 0;line-height:1.1}
.dh .eyebrow{color:var(--muted)}
.dbody section{display:grid;gap:8px;min-width:0}
.dbody h3{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ent{all:unset;cursor:pointer;border-bottom:1px dotted var(--sea);color:inherit;font:inherit}
.ent:hover{color:var(--sea)}
.ent:focus-visible{outline:2px solid var(--tangerine);outline-offset:2px}
.hn .ent{font-weight:700}
.chips .ent{border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--bg);font-size:14px}
.chips .ent small{font-family:var(--mono);color:var(--muted)}
.more{font-size:12px;color:var(--muted);font-family:var(--body);font-weight:400;margin-left:6px}
.formstrip{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.formstrip .chnote{margin-left:6px}
.chnote{margin:0;font-size:12px;color:var(--muted)}
/* charts */
svg.ch{display:block;max-width:100%;height:auto;overflow:visible;font-family:var(--mono)}
.ch .grid{stroke:var(--line);stroke-width:1}
.ch .ax{fill:var(--muted);font-size:11px}
.ch .ax.dim{opacity:.7}.ch .ax.me{fill:var(--ink);font-weight:700}
.ch .val{fill:var(--ink);font-size:12px}
.ch .fieldbar{stroke:var(--line);stroke-width:4;stroke-linecap:round}
.ch .dot{stroke:var(--surface);stroke-width:2;fill:var(--chip)}
.ch .dot.p1{fill:var(--win);stroke:var(--winring);stroke-width:3}.ch .dot.p2,.ch .dot.p3{fill:var(--chip)}
.ch .dotlbl{fill:var(--ink);font-size:10px;pointer-events:none}
.ch .dot.p1+ .dotlbl{fill:#fff}
.ch .ghost{fill:var(--line)}
.ch .bar.me{fill:var(--tangerine)}.ch .bar.other{fill:var(--chip)}
.ch .avg{stroke:var(--sea);stroke-width:2;stroke-dasharray:4 3}
.ch .seg.p1{fill:var(--win)}.ch .seg.p2{fill:var(--muted)}.ch .seg.p3{fill:var(--line)}.ch .seg.oth{fill:var(--chip)}
.ch.rank{max-height:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--chip)}
.sw.p1{background:var(--win)}.sw.me{background:var(--tangerine)}.sw.p2{background:var(--muted)}.sw.p3{background:var(--line)}.sw.win{background:var(--win);border:2px solid var(--winring)}.sw.fb{background:var(--line)}.sw.oth{background:var(--chip)}
.sw.avgl{background:transparent;border-top:2px dashed var(--sea);height:0;border-radius:0;vertical-align:2px}
.tip{position:fixed;z-index:50;background:var(--basalt);color:#fff;font-size:12px;padding:5px 8px;border-radius:6px;pointer-events:none;max-width:280px;line-height:1.4}
@media (prefers-reduced-motion:reduce){.dback{transition:none}}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;padding:4px 10px;border-radius:999px;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--basalt);color:#fff;border-color:var(--basalt)}
.fchip small{font-family:var(--mono);opacity:.7}
.ranktbl{min-width:0;width:100%;table-layout:auto;font-size:13px}
.ranktbl th,.ranktbl td{padding:7px 8px}
.ranktbl .hn .sub2{font-size:11px}
.ranktbl th button{all:unset;cursor:pointer;display:inline-block;padding:4px 6px;border-radius:6px;border:1px dashed transparent;position:relative}
.ranktbl th button .si{margin-left:4px;font-size:11px;color:var(--sea);opacity:.85}
.ranktbl th button:hover{background:var(--surface);border-color:var(--sea);color:var(--ink)}
.ranktbl th button.on{color:var(--sea);font-weight:700;background:var(--surface);border:1px solid var(--sea)}
.sorthint{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:0 0 8px}
.sorthint .kbd{font-family:var(--mono);border:1px dashed var(--sea);color:var(--sea);border-radius:6px;padding:1px 6px;font-size:11px}
.ranktbl th button:focus-visible{outline:2px solid var(--tangerine)}
.ranktbl td.fc,.ranktbl th.fc{min-width:0}
.ranktbl .off{opacity:.35}
.pbar{display:inline-block;width:56px;height:10px;background:var(--chip);border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:6px}
.pbar i{display:block;height:100%;background:var(--tangerine)}
.pv{font-family:var(--mono);font-weight:700}
.fbar{width:54px;height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin-left:auto}
.fbar i{display:block;height:100%;background:var(--sea)}
.fv{font-family:var(--mono);font-size:11px;color:var(--muted);display:block;margin-top:3px}
details.why{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--bg)}
details.why summary{cursor:pointer;font-weight:700;font-size:14px}
.whybody{display:grid;gap:8px;margin-top:8px;font-size:14px;max-width:70ch}
.whybody p{margin:0}
.pacewrap{display:grid;gap:6px}
.ch.pace .pl polyline{fill:none;stroke:var(--line);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch.pace .pl .hit{stroke:transparent;stroke-width:12}
.ch.pace .pl.p1 polyline:not(.hit){stroke:var(--win);stroke-width:3}
.ch.pace .pl:hover polyline:not(.hit),.ch.pace .pl.me polyline:not(.hit){stroke-width:4;stroke:var(--sea)}
.ch.pace .pl:hover text,.ch.pace .pl.me text{fill:var(--ink);font-weight:700}
.ch .dot.early{fill:var(--chip);stroke:var(--muted)}
.ch .styleln{stroke:var(--line);stroke-width:2}
.sw.early{background:var(--chip);border:1px solid var(--muted)}
.stylek{color:var(--tangerine)}
.trackwrap{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:start}
.trackwrap .ckbtns{grid-column:1/-1}
@media (max-width:640px){.trackwrap{grid-template-columns:1fr}}
.ckbtns{display:flex;flex-wrap:wrap;gap:6px}
.ckbtns button{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-family:var(--mono);font-size:13px;padding:4px 10px;border-radius:8px;cursor:pointer}
.ckbtns button[aria-pressed="true"]{background:var(--basalt);color:#fff;border-color:var(--basalt)}
.ckbtns .play{margin-left:auto;font-family:var(--body)}
.ch.trk .turf{fill:none;stroke:var(--chip);stroke-width:38}
.ch.trk .rail{fill:none;stroke:var(--line);stroke-width:1}
.ch.trk .ckline{stroke:var(--line);stroke-width:2}.ch.trk .ckline.on{stroke:var(--tangerine);stroke-width:3}
.ch.trk .startline{stroke:var(--sea);stroke-width:3}
.ch.trk .hd{transition:transform .7s cubic-bezier(.4,0,.2,1)}
@media (prefers-reduced-motion:reduce){.ch.trk .hd{transition:none}}
.orderwrap{min-width:150px}

  rankNote:"열 제목을 누르면 그 항목의 실제 값으로 순위를 다시 매깁니다. '모델 승률'은 여섯 항목을 가중 합산한 종합 순위(스토리의 선정과 같음)입니다. 마번은 출전표 그대로입니다. 참고용 모델이며 실제 배당이나 경주 전개는 반영하지 않습니다.",sortHint:"열 제목을 누르면 그 항목으로 정렬됩니다. ▼ 표시가 현재 정렬 기준입니다.",sortModel:"정렬: 모델 종합 (거리 15% · 폼 27% · 말 승률 16% · 기수 16% · 조교사 10% · 레이팅 15%)",sortBy:n=>`정렬: ${n} (실제 값 기준)`,
  rankLegend:"표의 값은 실제 값입니다. 거리 적성: 오늘 거리 ±100m 경주의 평균 착순(낮을수록 좋음, 기록 없으면 '추정'). 최근 폼: 최근 5전 평균 착순과 착순 나열(최신 순). 말 승률: 통산 1착 비율. 기수·조교사: 제주 통산 승률. 레이팅: KRA 레이팅. 종합 모델 승률은 이 값들을 경주 안에서 상대 비교해 가중 합산합니다(표본이 적으면 평균 쪽으로 보정).",
  whyTitle:"어떻게 유력마를 고르나요?",
  whyBody:`<p><b>여섯 가지를 봅니다.</b> 거리 적성(비슷한 거리에서의 성적) 15%, 최근 폼(최근 5전, 최신 경주에 가중) 27%, 말 통산 승률 16%, 기수 승률 16%, 조교사 승률 10%, 레이팅 15%. 각 항목을 이 경주 출전마 안에서 0~1로 맞춘 뒤 가중치대로 더하고, 그 합을 경주 전체가 100%가 되는 승률로 바꿉니다. 상위 3두가 '누가 앞서 보이나'에 오릅니다. 표본이 적은 말은 평균 쪽으로 보정하고, 데이터가 없는 항목은 중간값으로 둡니다.</p>
<p><b>왜 경주 안에서 상대 비교로 계산하나요? 승률은 그 경주 안에서만 의미가 있기 때문입니다.</b> 레이팅 60인 말은 제5등급에서는 압도적이지만 제1등급에서는 꼴찌 후보입니다. 그래서 요소마다 절대값 대신 "이 경주 출전마 중 어디쯤인가"로 바꾼 뒤, 합계를 경주 전체가 100%가 되는 승률로 만듭니다. 승자는 한 마리이므로 합이 100%인 형태가 배당과도 같은 구조입니다.</p>
<p><b>요소들의 단위가 제각각이라 그대로 더할 수 없기 때문입니다.</b> 레이팅은 0~120점, 상금은 수천만 원, 기수 승률은 5~18%, 폼은 착순 백분위입니다. 각각을 경주 안에서 0~1로 맞춰야 "레이팅 15% + 폼 27%" 같은 가중치가 뜻대로 작동합니다.</p>
<p><b>이 방식의 약점.</b> 격차 크기가 사라집니다. 레이팅이 101·100·99인 경주와 101·70·50인 경주에서 1위 말의 레이팅 점수는 둘 다 1.0으로 같지만, 실제로는 뒤쪽 경주의 1위가 훨씬 유리합니다. 경주 간 비교도 되지 않습니다. 1R의 36%와 7R의 36%는 같은 뜻이 아닙니다. 표본이 2~3두뿐인 요소는 상대 비교가 과장됩니다.</p>
<p><b>다음 단계.</b> 레이팅 차이, 해당 거리 실제 승률처럼 절대 기준으로 먼저 점수를 매긴 뒤 경주 안에서 승률로 바꾸면 격차 크기가 살아납니다. 결과가 쌓이면 가중치를 손으로 정하는 대신 실제 결과에 맞춰 학습시킬 수 있습니다. 지금 버전은 그 전 단계의 참고용 모델입니다.</p>`,

  whyTitle:"How do we choose the best horses?",
  whyBody:`<p><b>We look at six things.</b> Distance fit (record at similar trips) 15%, recent form (last five runs, weighted to the latest) 27%, the horse's career win rate 16%, the jockey's win rate 16%, the trainer's win rate 10%, and rating 15%. Each factor is scaled 0–1 within this race's field, added up by those weights, and the total is turned into a win % that sums to 100 across the race. The top three appear under "Who looks best". Small samples are shrunk toward the average, and a missing factor is set to the midpoint.</p>
<p><b>Why relative to the field? Because a win chance only means something within one race.</b> A horse rated 60 dominates Class 5 and is a backmarker in Class 1. So each factor is converted from its raw value to "where does this horse sit among today's runners", and the total becomes a win % that sums to 100 across the race. One horse wins, so a field that sums to 100% is the same shape as a betting market.</p>

      const rk=rankField(field,r).sort((a,b)=>b.prob-a.prob); const m=rk.map(x=>x.h.no), a=res.map(x=>x.h.no);
      const pr=paceFor(d,r.raceNo); let fav=null; if(pr.length){ const withOdds=pr.filter(p=>p.win>0); if(withOdds.length) fav=withOdds.sort((p,q)=>p.win-q.win)[0].gate; }
      const winSp=(paceOf(d,r.raceNo,res[0].x.hrnm)||{}).win||null;
      out.push({day:k,race:r.raceNo,dist:r.raceDs,cls:r.raceClas,n:field.length,model:rk.slice(0,3).map(x=>({no:x.h.no,name:x.h.hrnm,hrNo:x.h.hrNo,prob:x.prob})),actual:res.slice(0,3).map(x=>({no:x.h.no,name:x.h.hrnm,hrNo:x.h.hrNo})),
        winRank:m.indexOf(a[0])+1,pickPos:a.indexOf(m[0])+1||99,overlap:m.slice(0,3).filter(x=>a.slice(0,3).includes(x)).length,fav,favWon:fav!=null?fav===a[0]:null,pickIsFav:fav!=null?fav===m[0]:null,winSp,topProb:rk[0].prob}); });
  });

}

/* 착순 추이: 최근 10전 */
function chartForm(rs){
  const t=T[lang]; rs=rs.slice(0,10).reverse(); if(!rs.length) return `<p class="noent">${t.noForm}</p>`;
  const W=520,H=170,L=34,R=12,T0=14,B=40,n=rs.length,step=(W-L-R)/n;
  const maxF=Math.max(...rs.map(r=>parseInt(String(r.chak).split("/")[1])||10),8);
  const y=p=>T0+(p-1)/(maxF-1)*(H-T0-B);
  let g="";
  [1,Math.round(maxF/2),maxF].forEach(p=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(p)}" y2="${y(p)}" class="grid"/><text x="${L-6}" y="${y(p)+4}" class="ax" text-anchor="end">${p}</text>`;});
  let marks="";
  rs.forEach((r,i)=>{const x=L+step*(i+0.5), f=parseInt(String(r.chak).split("/")[1])||maxF, p=pos(r.chak);
    marks+=`<line x1="${x}" x2="${x}" y1="${y(1)}" y2="${y(f)}" class="fieldbar"/>`;
    if(p!==99) marks+=`<circle cx="${x}" cy="${y(p)}" r="7" class="dot p${p<=3?p:0}" ${tipAttr(`${r.date} ${r.no}R · ${r.dist}m · ${r.chak} · ${r.time} · ${pname(r.jck)}`)}/><text x="${x}" y="${y(p)+3.5}" class="dotlbl" text-anchor="middle">${p}</text>`;
    else marks+=`<text x="${x}" y="${y(1)+4}" class="ax" text-anchor="middle">×</text>`;
    marks+=`<text x="${x}" y="${H-B+16}" class="ax" text-anchor="middle">${r.date.slice(5).replace("/",".")}</text><text x="${x}" y="${H-B+29}" class="ax dim" text-anchor="middle">${r.dist}m</text>`;});
  return svgOpen(W,H)+g+marks+`</svg><div class="legend"><span><i class="sw win"></i>1st</span><span><i class="sw fb"></i>${t.lgField}</span></div>`;
}

/* 오늘 출전마 중 위치: 가로 막대 */
function chartField(h,field){
  const t=T[lang]; const rows=[
    [t.pRating, x=>ratingOf(x)??0, v=>v||"–"],
    [t.mWin, x=>x.recAll[0]?x.recAll[1]/x.recAll[0]*100:0, v=>v.toFixed(0)+"%"],
    [t.p1y, x=>x.e1y, v=>t.man(v)],
    [t.pCareer, x=>x.career, v=>t.man(v)]];
  const W=520,rowH=34,H=rows.length*rowH+6,L=118,R=96;
  let out="";
  rows.forEach(([lbl,fn,fmt],i)=>{const vals=field.map(fn), mx=Math.max(...vals,1e-9), v=fn(h), rank=vals.filter(x=>x>v).length+1, y=i*rowH+6;
    out+=`<text x="${L-8}" y="${y+16}" class="ax" text-anchor="end">${esc(lbl)}</text>`;
    field.forEach(x=>{const w=fn(x)/mx*(W-L-R); out+=`<rect x="${L}" y="${y+10}" width="${w}" height="3" class="ghost"/>`;});
    out+=`<rect x="${L}" y="${y+6}" width="${Math.max(v/mx*(W-L-R),2)}" height="12" rx="2" class="bar me" ${tipAttr(`${lbl}: ${fmt(v)} · #${rank}/${field.length}`)}/>`;
    out+=`<text x="${W-R+8}" y="${y+16}" class="val">${esc(fmt(v))}</text><text x="${W}" y="${y+16}" class="ax dim" text-anchor="end">#${rank}/${field.length}</text>`;});
  return svgOpen(W,H)+out+`</svg><p class="chnote">${t.fieldNote2}</p>`;
}

/* 기수/조교사 순위 */
function chartRank(map,name){
  const t=T[lang]; const arr=[...map.entries()].filter(([,v])=>v.n>=100).sort((a,b)=>b[1].wr-a[1].wr); const avg=jejuAvg(map);
  const W=520,rowH=18,L=110,R=44,H=arr.length*rowH+8,mx=Math.max(...arr.map(a=>a[1].wr),avg);
  let out=`<line x1="${L+avg/mx*(W-L-R)}" x2="${L+avg/mx*(W-L-R)}" y1="2" y2="${H-4}" class="avg"/>`;
  arr.forEach(([nm,v],i)=>{const y=i*rowH+4, me=nm===name;
    out+=`<text x="${L-6}" y="${y+11}" class="ax ${me?"me":""}" text-anchor="end">${esc(pname(nm))}</text><rect x="${L}" y="${y+3}" width="${v.wr/mx*(W-L-R)}" height="10" rx="2" class="bar ${me?"me":"other"}" ${tipAttr(`${pname(nm)} · ${v.wr}% · ${v.n.toLocaleString()} ${t.rides}`)}/>`;
    if(me) out+=`<text x="${L+v.wr/mx*(W-L-R)+6}" y="${y+12}" class="val">${v.wr}%</text>`;});
  return svgOpen(W,H,"rank")+out+`</svg><div class="legend"><span><i class="sw me"></i>${esc(pname(name))}</span><span><i class="sw avgl"></i>${t.avgLbl} ${avg.toFixed(1)}%</span></div>`;
}

/* 통산 결과 구성: 가로 누적 */
function chartOutcome(v){
  const t=T[lang]; const parts=[[t.o1,v.w,"p1"],[t.o2,v.s,"p2"],[t.o3,v.t,"p3"],[t.oOther,v.n-v.w-v.s-v.t,"oth"]]; const W=520,H=26; let x=0,out="";
  parts.forEach(([l,c,cls])=>{const w=c/v.n*W; out+=`<rect x="${x}" y="4" width="${Math.max(w-2,0)}" height="18" rx="2" class="seg ${cls}" ${tipAttr(`${l}: ${c.toLocaleString()} (${(c/v.n*100).toFixed(1)}%)`)}/>`; x+=w;});
  return svgOpen(W,H)+out+`</svg><div class="legend">${parts.map(([l,c,cls])=>`<span><i class="sw ${cls}"></i>${l} ${(c/v.n*100).toFixed(1)}%</span>`).join("")}</div>`;
}

function statTiles(items){ return `<div class="stats">${items.map(([k,v,c])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div>${c?`<div class="c">${c}</div>`:""}</div>`).join("")}</div>`; }
const chipBtn=(kind,name,extra="")=>`<button type="button" class="ent ${kind}" data-kind="${kind}" data-name="${esc(name)}">${esc(kind==="horse"?dname(name):pname(name))}${extra}</button>`;

function drawerHorse(name){
  const t=T[lang]; const h=runs.find(x=>x.hrnm===name)||reg.find(x=>x.hrnm===name); const info=infoFor(h&&h.hrNo,name); const rs=recentFor(name).filter(x=>x.gbn==="R");
  const field=h&&h.jck?runs.filter(x=>x.raceNo==h.raceNo):[];
  const race=h&&races.find(r=>r.raceNo==h.raceNo);
  const sexName={"수":lang==="ko"?"수말":"Colt/horse","암":lang==="ko"?"암말":"Filly/mare","거":lang==="ko"?"거세마":"Gelding"}[h?h.gndr:info?.sex]||"";
  const breed=info?(lang==="ko"?info.breed:({"제주마":"Jeju pony","한라마":"Halla horse","더러브렛":"Thoroughbred","소형마":"Small horse","중형마":"Medium horse"})[info.breed]||info.breed):kdName(h?.kd||"");
  const head=`<div class="dh"><div class="eyebrow">${t.dHorse}</div><h2>${esc(dname(name))}${lang==="en"?` <span class="eng">${esc(name)}</span>`:info?.hrEngNm?` <span class="eng">${esc(titleCase(info.hrEngNm))}</span>`:""}</h2>
    <div class="ps">${esc(breed)} · ${esc(sexName)}${h?` · ${lang==="ko"?h.ag+"세":"age "+h.ag}`:""}${race?` · ${race.raceNo}R ${t.saddle} ${h.no}`:""}</div>
    ${h&&h.jck?`<div class="chips">${chipBtn("jockey",h.jck,jkTag(h.jck))}${chipBtn("trainer",h.trar,trTag(h.trar))}</div>`:""}</div>`;
  const rec=h?h.recAll:(info?[+info.rcCnt,+info.fstCnt,+info.sndCnt,+info.trdCnt]:[0,0,0,0]);
  const tiles=statTiles([[t.career,`${rec[1]}-${rec[2]}-${rec[3]}`,lang==="ko"?`${rec[0]}전`:`${rec[0]} starts`],[t.winPct,`${pct(rec[1],rec[0])}%`,`${t.top3} ${pct(rec[1]+rec[2]+rec[3],rec[0])}%`],
    [t.p1y,t.man(h?h.e1y:0)],[t.pCareer,t.man(h?h.career:+(info?.amt||0))],...(info&&+info.avgWinDist?[[t.avgWin,`${info.avgWinDist}m`]]:[]),...(rs.length?[[t.lastRun,`${daysBetween(rs[0].date,cutDate())}${lang==="ko"?"일 전":" days ago"}`,rs[0].date.slice(5).replace("/",".")]]:[])]);
  const st=styleOf(name);
  return head+`<section><h3>${t.chForm}</h3>${chartForm(rs)}</section>`+(st?`<section><h3>${t.styleTitle}: <span class="stylek">${t.styles[st.k]}</span> <small class="chnote">${st.n}${lang==="ko"?"전 기준":" runs"}</small></h3>${chartStyle(st)}<p class="chnote">${t.styleNote}</p></section>`:"")+(field.length>1?`<section><h3>${t.chField}</h3>${chartField(h,field)}</section>`:"")+(()=>{const pf=paceFit(name); if(!pf.fast.n&&!pf.even.n&&!pf.slow.n) return "";
      const cell=(k,lbl)=>`<div class="stat"><div class="k">${lbl}</div><div class="v">${pf[k].n?pf[k].avgFin.toFixed(1)+(lang==="ko"?"착":""):"–"}</div><div class="c">${pf[k].n?(lang==="ko"?`${pf[k].n}전 평균`:`avg of ${pf[k].n}`):(lang==="ko"?"기록 없음":"no runs")}</div></div>`;
      return `<section><h3>${lang==="ko"?"초반 페이스별 성적":"Record by early pace"}</h3><div class="stats">${cell("fast",lang==="ko"?"빠른 페이스":"Fast pace")}${cell("even",lang==="ko"?"보통":"Even")}${cell("slow",lang==="ko"?"느린 페이스":"Slow pace")}</div><p class="chnote">${lang==="ko"?"페이스 판정: 그 경주 선두마의 첫 200m(S1F) 시간이 같은 거리 중앙값보다 0.3초 이상 빠르면 빠름, 느리면 느림.":"Pace is judged from the leader's first 200 m (S1F) in that race: 0.3 s or more under the median for the distance is fast, over is slow."}</p></section>`;})()+`<section><h3>${t.chStats}</h3>${tiles}</section>`+
    (info?`<section><h3>${t.pedigree}</h3><div class="ped"><div class="pk">${t.sire}</div><div>${esc(info.fhrNm)}</div><div class="pk">${t.dam}</div><div>${esc(info.mhrNm)} <span class="ps">(${t.damsire} ${esc(info.mhrFhrNm)})</span></div></div><p class="chnote">${t.born} ${fdate(info.birthDt)} · ${t.debut} ${fdate(info.fdebutDt)} · ${lang==="ko"?info.color:(COLOR[info.color]||info.color)}</p></section>`:"");
}

function drawerPerson(kind,name){
  const t=T[lang]; const map=kind==="jockey"?jks:trs; const v=map.get(name); const rec=recentRides(kind,name,30); const today=todayRides(kind,name);
  const rw=rec.filter(r=>pos(r.chak)===1).length, r3=rec.filter(r=>pos(r.chak)<=3).length;
  const head=`<div class="dh"><div class="eyebrow">${kind==="jockey"?t.dJockey:t.dTrainer}</div><h2>${esc(pname(name))}${lang==="en"?` <span class="eng">${esc(name)}</span>`:enPerson.get(name)?` <span class="eng">${esc(enPerson.get(name))}</span>`:""}</h2>
    <div class="ps">${v?(kind==="jockey"?t.jkLine(v):t.trLine(v)):t.noStats}</div></div>`;
  const recent=`<section><h3>${t.last30}</h3>${statTiles([[t.rides,rec.length],[t.wins,rw,`${pct(rw,rec.length)}%`],[t.top3,r3,`${pct(r3,rec.length)}%`],[t.avgLbl,`${jejuAvg(map).toFixed(1)}%`,t.careerWin]])}
    ${rec.length?`<div class="formstrip">${rec.slice(0,15).map(r=>{const p=pos(r.chak);return `<span class="fp fp${p<=3?p:0}" ${tipAttr(`${r.date} ${r.no}R · ${dname(r.hrnm,r.hrNo)} · ${r.chak}`)}>${p===99?"x":p}</span>`;}).join("")}<span class="chnote">${t.newestFirst}</span></div>`:`<p class="noent">${t.noRecent}</p>`}</section>`;
  const rank=v?`<section><h3>${kind==="jockey"?t.chRankJ:t.chRankT}</h3>${chartRank(map,name)}</section>`:"";
  const outcome=v&&v.n?`<section><h3>${t.chOutcome}</h3>${chartOutcome(v)}</section>`:"";
  const td=today.length?`<section><h3>${t.todayRides}</h3><div class="chips">${today.map(h=>chipBtn("horse",h.hrnm,` <small>${h.raceNo}R</small>`)).join("")}</div></section>`:"";
  return head+recent+rank+outcome+td;
}

function openEntity(kind,name){
  drawerState={kind,name}; const el=$("drawer"); el.hidden=false; document.body.classList.add("drawer-open");
  $("dbody").innerHTML=kind==="horse"?drawerHorse(name):drawerPerson(kind,name);
  $("dbody").scrollTop=0; $("dclose").focus();
  $("dbody").querySelectorAll(".ent").forEach(b=>b.onclick=()=>openEntity(b.dataset.kind,b.dataset.name));
}
function closeDrawer(){ drawerState=null; $("drawer").hidden=true; document.body.classList.remove("drawer-open"); }
$("dclose").onclick=closeDrawer; $("dback").onclick=closeDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&drawerState) closeDrawer();});
/* tooltip */
const tipEl=$("tip");
document.addEventListener("mousemove",e=>{const n=e.target.closest&&e.target.closest("[data-tip]"); if(!n){tipEl.hidden=true;return;} tipEl.textContent=n.dataset.tip; tipEl.hidden=false; tipEl.style.left=Math.min(e.clientX+12,window.innerWidth-tipEl.offsetWidth-8)+"px"; tipEl.style.top=(e.clientY+14)+"px";});
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest(".ent"); if(b&&!$("drawer").contains(b)){e.stopPropagation(); openEntity(b.dataset.kind,b.dataset.name);}},true);

/* ---- 예측 순위 ---- */
const FACTORS=[["dist",0.15],["form",0.27],["hwin",0.16],["jock",0.16],["trn",0.10],["ratg",0.15]];
let rankSort="model";
const pctl=r=>{const p=pos(r.chak), f=parseInt(String(r.chak).split("/")[1])||10; return p===99?0:1-(p-1)/Math.max(f-1,1);};
function rawFactors(h,race){
  const rs=recentFor(h.hrnm).filter(x=>x.gbn==="R"), info=infoFor(h.hrNo,h.hrnm);
  const near=rs.filter(x=>Math.abs(x.dist-race.raceDs)<=100);
  let dist=null, distN=near.length;
  if(near.length) dist=sum(near.map(pctl))/near.length;
  else if(info&&+info.avgWinDist) dist=Math.max(0,1-Math.abs(+info.avgWinDist-race.raceDs)/400)*0.6+0.2;
  const last=rs.slice(0,5), wts=[5,4,3,2,1];
  const form=last.length?sum(last.map((r,i)=>pctl(r)*wts[i]))/sum(wts.slice(0,last.length)):null;
  const n=h.recAll[0], hwin=(h.recAll[1]+0.5*(h.recAll[2]+h.recAll[3])+1)/(n+8);
  const j=jks.get(h.jck), tr=trs.get(h.trar), ja=jejuAvg(jks)/100, ta=jejuAvg(trs)/100;
  const jock=j&&j.n?(j.w+ja*50)/(j.n+50):ja, trn=tr&&tr.n?(tr.w+ta*50)/(tr.n+50):ta;
  const rt=ratingOf(h); const ratg=(rt==null||rt===0)?null:rt;
  return {dist,distN,form,formN:last.length,hwin,jock,trn,ratg};
}
/* 항목별 절대값: 표에 보여 주고 정렬에 쓴다. v=값, lo=true면 낮을수록 좋음(평균 착순), n=표본 수 */
function absFactors(x){
  const h=x.h, rs=runHist(h.hrnm), race=races[sel];
  const near=rs.filter(r=>Math.abs(r.dist-race.raceDs)<=100), np=near.map(r=>pos(r.chak)).filter(p=>p!==99);
  const last=rs.slice(0,5), lp=last.map(r=>pos(r.chak)).filter(p=>p!==99);
  const j=jks.get(h.jck), tr=trs.get(h.trar);
  return {
    dist:{v:np.length?sum(np)/np.length:null,n:near.length,lo:true,est:(!np.length&&x.f.dist!=null)},
    form:{v:lp.length?sum(lp)/lp.length:null,n:last.length,lo:true,seq:last.map(r=>pos(r.chak))},
    hwin:{v:h.recAll[0]?h.recAll[1]/h.recAll[0]*100:null,n:h.recAll[0]},
    jock:{v:j&&j.n?+j.wr:null,n:j?j.n:0},
    trn:{v:tr&&tr.n?+tr.wr:null,n:tr?tr.n:0},
    ratg:{v:x.f.ratg}
  };
}
function rankField(field,race){
  const raw=field.map(h=>({h,f:rawFactors(h,race)}));
  const norm=k=>{const vals=raw.map(x=>x.f[k]).filter(v=>v!=null); if(!vals.length) return ()=>0.5; const mn=Math.min(...vals),mx=Math.max(...vals); return v=>v==null?0.5:mx>mn?(v-mn)/(mx-mn):0.5;};
  const fns=Object.fromEntries(FACTORS.map(([k])=>[k,norm(k)]));
  raw.forEach(x=>{x.n=Object.fromEntries(FACTORS.map(([k])=>[k,fns[k](x.f[k])])); x.score=sum(FACTORS.map(([k,w])=>x.n[k]*w))/sum(FACTORS.map(f=>f[1])); x.a=absFactors(x);});
  const ex=raw.map(x=>Math.exp(4*x.score)), es=sum(ex); raw.forEach((x,i)=>x.prob=ex[i]/es*100);
  return raw;
}
function renderRank(field){
  const t=T[lang], r=races[sel], body=$("tabbody"), rows=rankField(field,r), ko=lang==="ko";
  const key=rankSort;
  if(key==="model") rows.sort((a,b)=>b.prob-a.prob);
  else rows.sort((a,b)=>{const A=a.a[key],B=b.a[key]; if(A.v==null&&B.v==null) return b.prob-a.prob; if(A.v==null) return 1; if(B.v==null) return -1; return (A.lo?A.v-B.v:B.v-A.v)||(b.prob-a.prob);});
  const maxP=Math.max(...rows.map(x=>x.prob));
  const runs=n=>ko?`${n}전`:`${n}r`;
  const fmt={
    dist:x=>{const a=x.a.dist; return a.v!=null?`${a.v.toFixed(1)}${ko?"착":""} <small>· ${runs(a.n)}</small>`:a.est?`<small>${ko?"추정":"est."}</small>`:"–";},
    form:x=>{const a=x.a.form; return a.v!=null?`${a.v.toFixed(1)}${ko?"착":""} <small>· ${a.seq.map(p=>p===99?"–":p).join("·")}</small>`:"–";},
    hwin:x=>{const a=x.a.hwin; return a.v!=null?`${a.v.toFixed(0)}% <small>· ${runs(a.n)}</small>`:"–";},
    jock:x=>{const a=x.a.jock; return a.v!=null?`${a.v.toFixed(1)}% <small>· ${runs(a.n)}</small>`:"–";},
    trn:x=>{const a=x.a.trn; return a.v!=null?`${a.v.toFixed(1)}% <small>· ${runs(a.n)}</small>`:"–";},
    ratg:x=>x.a.ratg.v==null?"–":`R${x.a.ratg.v}`};
  // 막대: 항목별 최고를 100%로. 낮을수록 좋은 항목(평균 착순)은 뒤집어서
  const bar=(k,x)=>{const a=x.a[k]; if(a.v==null) return 0; const vals=rows.map(y=>y.a[k].v).filter(v=>v!=null); const mn=Math.min(...vals),mx=Math.max(...vals); if(mx===mn) return 100; return a.lo?(mx-a.v)/(mx-mn)*100:(a.v-mn)/(mx-mn)*100;};
  const head=`<th class="n">#</th><th class="n">${t.fcols[0]}</th><th>${t.fcols[1]}</th><th class="n"><button type="button" data-s="model" class="${key==="model"?"on":""}">${t.modelP} <span class="si">${key==="model"?"▼":"⇅"}</span></button></th>`+
    FACTORS.map(([k,w])=>`<th class="n fc"><button type="button" data-s="${k}" class="${key===k?"on":""}">${t.fnames[k]} <span class="si">${key===k?"▼":"⇅"}</span><small>${Math.round(w*100)}%</small></button></th>`).join("");
  const trows=rows.map((x,i)=>`<tr tabindex="0" data-n="${x.h.no}"><td class="n"><b>${i+1}</b></td><td class="n">${saddle(x.h.no)}</td>
     <td class="hn">${chipBtn("horse",x.h.hrnm)}${(()=>{const f=finishOf(x.h);return f?` <span class="place p${f<=3?f:0}" title="${t.finished}">${f===99?"–":f}</span>`:"";})()}<div class="sub2">${esc(pname(x.h.jck))} · ${esc(pname(x.h.trar))}</div></td>
     <td class="n ${key==="model"?"sortcol":""}"><div class="pbar"><i style="width:${x.prob/maxP*100}%"></i></div><span class="pv">${x.prob.toFixed(1)}%</span></td>`+
     FACTORS.map(([k])=>`<td class="n fc ${key===k?"sortcol":""}"><div class="fbar"><i style="width:${bar(k,x)}%"></i></div><span class="fv">${fmt[k](x)}</span></td>`).join("")+`</tr>`).join("");
  const sortNote=key==="model"?t.sortModel:t.sortBy(t.fnames[key]);
  body.innerHTML=`<div class="ehead"><p>${t.rankNote}</p></div><p class="sorthint"><span class="kbd">${t.fnames.form} ⇅</span>${t.sortHint}</p><p class="sortnote">${sortNote}</p>
    <div class="tbl"><table class="ranktbl"><thead><tr>${head}</tr></thead><tbody>${trows}</tbody></table></div><p class="chnote">${t.rankLegend}</p>
    <details class="why"><summary>${t.whyTitle}</summary><div class="whybody">${t.whyBody}</div></details>`;
  body.querySelectorAll("th button").forEach(b=>b.onclick=()=>{rankSort=b.dataset.s; renderRank(field);});
}

function runHist(name){ return recentFor(name).filter(r=>r.gbn==="R"); }
function whyReasons(x,race){
  const ko=lang==="ko", f=x.f, h=x.h, out=[];
  const rs=runHist(h.hrnm);
  if(f.form!=null&&x.n.form>=0.7&&rs.length){ const l=rs.slice(0,3).map(r=>ordL(pos(r.chak)));
    out.push(ko?`최근 ${l.length}전 ${l.join(" · ")}`:(l.length===1?`last run: ${l[0]}`:`last ${l.length} runs: ${l.join(", ")}`)); }
  if(f.distN>0&&x.n.dist>=0.7){ const near=rs.filter(r=>Math.abs(r.dist-race.raceDs)<=100), ap=near.map(r=>pos(r.chak)).filter(p=>p!==99);
    if(ap.length){ const a=(sum(ap)/ap.length).toFixed(1); out.push(ko?`비슷한 거리(±100m) ${near.length}전 평균 ${a}착`:`${near.length} ${near.length===1?"run":"runs"} near this distance, average finish ${a}`); } }
  const j=jks.get(h.jck); if(j&&j.n>=30&&x.n.jock>=0.7) out.push(ko?`${pname(h.jck)} 기수 제주 통산 승률 ${j.wr}%`:`jockey ${pname(h.jck)} wins ${j.wr}% of Jeju rides`);
  const tt=trs.get(h.trar); if(tt&&tt.n>=30&&x.n.trn>=0.8) out.push(ko?`${pname(h.trar)} 조교사 통산 승률 ${tt.wr}%`:`trainer ${pname(h.trar)} wins ${tt.wr}% of Jeju starters`);
  if(f.ratg!=null&&x.n.ratg>=0.8) out.push(ko?`레이팅 R${f.ratg}로 출전마 중 상위`:`rating R${f.ratg}, near the top of this field`);
  return out.slice(0,3);
}
function buildStory(field,race){

  const ws=field.map(h=>h.wgt).filter(Boolean), wmin=Math.min(...ws), wmax=Math.max(...ws);

  const age=race.cndtsAg?(ko?`${race.cndtsAg}`:String(race.cndtsAg).replace("세이하"," and under").replace("세이상","+")):"";
  const clsLbl=glBtn("class",esc(classLabel(race.raceClas)));
  /* 1. 어떤 경주인가 */
  let p1=ko?`${n}두가 ${race.raceDs}m를 달리는 ${clsLbl} 경주입니다. `:`${n} runners go ${race.raceDs} m in a ${clsLbl} race. `;
  p1+=unrated
    ?(ko?`6등급은 아직 ${glBtn("rating","레이팅")}이 없는 말들의 입문 단계로, 순위상금을 누적 700만 원 벌면 레이팅을 받고 위 등급으로 올라갑니다. `
        :`Class 6 is the entry level for horses with no ${glBtn("rating","rating")} yet: once one earns ₩7M in prize money it gets a rating and moves up. `)
    :(RBAND[clsN]?(ko?`${RBAND[clsN]} 레이팅 구간의 말만 출전할 수 있습니다(${glBtn("rating","레이팅")} 1점 = 부담중량 0.5kg). `
        :`Only horses rated ${RBAND[clsN]} are eligible (one ${glBtn("rating","rating")} point = 0.5 kg). `):"");
  if(age) p1+=ko?`연령 조건은 ${esc(age)}입니다. `:`Age condition: ${esc(age)}. `;
  if(isFinite(wmin)){
    p1+=wmin===wmax
      ?(ko?`전원 ${wmin}kg으로 ${glBtn("weight","중량")}이 같습니다. `:`Every runner carries the same ${wmin} kg (${glBtn("weight","set weights")}). `)
      :(ko?`${glBtn("weight","부담중량")}은 ${wmin}~${wmax}kg입니다${hcap?"(핸디캡: 레이팅 차이를 중량으로 맞춤)":""}. `:`Weights run from ${wmin} to ${wmax} kg${hcap?" (handicap: rating gaps are evened out with weight)":""}. `);
  }
  if(mix) p1+=ko?`출전마 구성은 ${mix}. `:`Field: ${mix}. `;
  if(first) p1+=ko?`우승 상금은 ₩${fmt(first)}(총 ₩${fmt(tot)}), 마주 · 조교사 · 기수가 나눕니다.`:`The winner's share is ₩${fmt(first)} of a ₩${fmt(tot)} ${glBtn("prize","purse")}.`;
  /* 2. 누가 앞서나 */

  const gap=rows.length>1?rows[0].prob-rows[1].prob:99;

/* 전개 예측: 주행 스타일(초반·4C 위치)과 모델 승률로 각 지점의 예상 순서를 만든다 */
function predictRows(field,race){
  const rk=rankField(field,race); const maxP=Math.max(...rk.map(x=>x.prob)), minP=Math.min(...rk.map(x=>x.prob));
  const has2C=race.raceDs>TRK.seg.a+TRK.seg.right+TRK.seg.top;
  // 마지막 200m(G1F→결승) 스피드: 출전마 안에서 0(가장 빠름)~1(가장 느림). 기록 없으면 0.5
  const sts=rk.map(x=>styleOf(x.h.hrnm)); const gts=sts.map(st=>st&&st.g1fT!=null?st.g1fT:null).filter(v=>v!=null); const gmin=Math.min(...gts), gmax=Math.max(...gts);
  const sps=rk.map(x=>horseSpeed(x.h.hrnm,race.raceDs)); const ests=sps.filter(v=>v).map(v=>v.est); const emin=Math.min(...ests), emax=Math.max(...ests);
  const rows=rk.map((x,i)=>{const st=sts[i]; const early=st?st.early:0.55, turn=st&&st.turn!=null?st.turn:early; const pn=maxP>minP?(x.prob-minP)/(maxP-minP):0.5;
    const close=(st&&st.g1fT!=null&&gmax>gmin)?(st.g1fT-gmin)/(gmax-gmin):0.5;
    const speed=(sps[i]&&emax>emin)?(sps[i].est-emin)/(emax-emin):0.5;   // 0=예상 기록 가장 빠름
    return {gate:x.h.no,hrnm:x.h.hrnm,hrNo:x.h.hrNo,prob:x.prob,known:!!st,close,g1fT:st?st.g1fT:null,
      _s1f:early,_c2:early*0.75+turn*0.25,_c3:early*0.5+turn*0.5,_c4:turn,
      _g1f:turn*0.4+close*0.25+speed*0.1+(1-pn)*0.25,     // 코너를 돌아 직선: 4C 위치 + 막판 스피드 + 기록 + 모델
      _fin:(1-pn)*0.5+close*0.2+speed*0.15+turn*0.15};});   // 결승: 모델 승률 + 막판 스피드 + 예상 기록 + 4C 위치
  const rank=(k,out)=>{rows.slice().sort((a,b)=>a[k]-b[k]||b.prob-a.prob).forEach((r,i)=>r[out]=i+1);};
  rank("_s1f","s1f"); if(has2C) rank("_c2","c2"); rank("_c3","c3"); rank("_c4","c4"); rank("_g1f","g1f"); rank("_fin","ord");
  return rows;
}
function renderStory(field){

const toPace=a=>({date:a[0],no:a[1],hrnm:a[2],hrNo:a[3],gate:a[4],ord:a[5],s1f:a[6],c2:a[7],c3:a[8],c4:a[9],g1f:a[10],time:a[11],win:a[12],plc:a[13],diff:a[14],bw:a[15],dist:a[16],raw:a[17]});

function paceFor(dateSlash,no){ const d=dateSlash.replace(/\//g,""); return pace.filter(p=>String(p.date)===d&&p.no==no); }
function paceOf(dateSlash,no,hrnm){ return paceFor(dateSlash,no).find(p=>p.hrnm===hrnm); }
const CHECKS=[["s1f","S1F"],["c2","2C"],["c3","3C"],["c4","4C"],["g1f","G1F"],["ord","FIN"]];
function chartPace(rows,focus){

function kindOf(it){ const a=it[0]||{}; if("sjS1fOrd" in a) return "pace"; if("chulNo" in a&&"hrNameEn" in a) return "sheet";
  if(a.trName&&a.winRateTsum!=null) return "trainers"; if(a.jkName&&a.winRateTsum!=null) return "jockeys";
  if(a.hrEngNm!=null) return "horses"; if("chak" in a) return "results"; if("jckyNm" in a) return "runs"; if("hrnm" in a) return "reg"; return "races"; }
const LOADMSG={pace:"loadedPace",sheet:"loadedSheetN",races:"loaded",reg:"loadedReg",runs:"loadedRun",results:"loadedRes",jockeys:"loadedJk",trainers:"loadedTr",horses:"loadedInfo"};
function ingestText(raw){
  raw=raw.trim(); const t=T[lang];
  if(raw.startsWith("<")){
    const doc=new DOMParser().parseFromString(raw.replace(/<script\s*\/>/g,""),"text/xml");
    const items=[...doc.querySelectorAll("item")].map(n=>Object.fromEntries([...n.children].map(c=>[c.tagName,c.textContent])));
    if(!items.length) throw 0; const k=kindOf(items); ING[k](items); return t[LOADMSG[k]](items.length);
  }
  const j=JSON.parse(raw);
  if(j.bundle){
    const parts=[]; ["sheet","results","pace","jockeys","trainers","horses","races","reg","runs"].forEach(k=>{const it=j[k]; if(Array.isArray(it)&&it.length){ING[k](it); parts.push(`${t.bundleNames[k]} ${it.length}`);}});
    if(!parts.length) throw 0;
    const n=resultsFromPace(); if(n) parts.push((lang==="ko"?"구간 기록에서 결과 ":"results from sectionals ")+n); return t.loadedBundle(j.race_dt,parts.join(" · "));
  }
  const body=j?.response?.body; let it=body?.items?.item;
  if(body&&(!it||body.totalCount===0)) return {empty:true};
  if(!it) throw 0; if(!Array.isArray(it)) it=[it];
  const k=kindOf(it); ING[k](it); return t[LOADMSG[k]](it.length);
}
function runIngest(raw){
  const m=$("msg"); m.className="msg";
  try{ const r=ingestText(raw); if(r&&r.empty){m.textContent=T[lang].empty;m.className="msg err";return;} render(); m.textContent=r; }
  catch(e){ m.textContent=T[lang].err; m.className="msg err"; }
}
$("loadBtn").onclick=()=>runIngest($("json").value);
$("fileIn").onchange=e=>{const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>runIngest(String(rd.result)); rd.readAsText(f,"utf-8"); e.target.value="";};
function initDays(){ days.clear(); putDay({date:"20240817",races:SAMPLE.slice(),runs:RUN_SAMPLE.map(toRunner),reg:REG_SAMPLE.map(toHorse),sheet:false,sample:true});
  sheetToDays(SHEET_SAMPLE).forEach(putDay); mergeVet(LIVE_RUNS); useDay(pickDefaultDay()); }
$("resetBtn").onclick=()=>{races=SAMPLE.slice();reg=REG_SAMPLE.map(toHorse);runs=RUN_SAMPLE.map(toRunner);results=RES_SAMPLE.map(toRes);pace=PACE_SAMPLE.map(toPace);resKey=null;resSel=null;hinfo=new Map();addInfo(HINFO_SAMPLE);initDays();$("msg").textContent="";render();};
initDays(); render();
// 자동 업데이트: 같은 주소에 올라간 latest.json(수집기가 예약 실행으로 갱신)을 열 때마다 불러온다.
// 없으면(예: 미리보기 환경) 조용히 내장 샘플 데이터를 그대로 쓴다.
const DATA_URL="latest.json";
var lastCollected=null, liveInfo=null;
function liveBadge(){
  const b=$("liveBadge"); if(!b) return;
  if(!liveInfo){ b.hidden=true; return; }
  const today=(()=>{const d=new Date();return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;})();
  const isToday=liveInfo.date===today; b.hidden=false; b.className="livebadge"+(isToday?" on":"");
  b.innerHTML=`<i></i>${isToday?(lang==="ko"?"LIVE · 경주일 10분마다 갱신":"LIVE · updates every 10 min on race day"):(lang==="ko"?"최근 갱신":"Last updated")} <b>${esc(liveInfo.at||lastCollected||"")}</b>`;
}
async function loadLatest(first){
  try{
    const r=await fetch(DATA_URL+"?t="+Date.now(),{cache:"no-store"}); if(!r.ok) return;
    const raw=await r.text(); const j=JSON.parse(raw); if(!j.bundle) return;
    if(!first && j.collected===lastCollected) return;   // 바뀐 게 없으면 그대로
    lastCollected=j.collected; liveInfo=j.live||{date:"",at:j.collected};
    const keep={day:curDay,sel,view,resKey,resSel};
    runIngest(raw);
    if(!first){ if(days.has(keep.day)){useDay(keep.day); sel=keep.sel; view=keep.view;} resKey=keep.resKey; resSel=keep.resSel; render(); }
    const m=$("msg"); if(m.className==="msg" && j.collected) m.textContent+=" · "+(lang==="ko"?"자동 갱신 ":"auto-updated ")+j.collected;
    liveBadge();
  }catch(e){}
}
loadLatest(true);
// 열려 있는 동안 2분마다 새 데이터가 올라왔는지 확인 (탭이 보일 때만)
setInterval(()=>{ if(document.visibilityState==="visible") loadLatest(false); },120000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") loadLatest(false); });
</script>
